<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木工製作シミュレーション（3D組立・材料取図）</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Three.js 3Dライブラリの読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- jsPDF ライブラリの読み込み（PDF保存用） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- html2canvas ライブラリの読み込み（レイアウトを画像化してPDFに入れる） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-amber-800 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2 cursor-pointer" onclick="showDashboard()">
            🪵 中学校技術科 木工加工シミュレーター
        </h1>
        <div class="flex items-center gap-3">
            <button onclick="showDashboard()" id="nav-home-btn" class="hidden text-xs bg-amber-900 hover:bg-amber-700 px-3 py-1.5 rounded-lg border border-amber-700 transition">
                🏠 プロジェクト一覧へ
            </button>
            <span class="text-xs bg-amber-900 px-3 py-1 rounded-full border border-amber-700" id="header-status-badge">ホーム画面</span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">

        <!-- ────────────────────────────────────────────── -->
        <!-- トップページ（プロジェクト一覧・管理画面） -->
        <!-- ────────────────────────────────────────────── -->
        <section id="view-dashboard" class="flex flex-col gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-xl font-bold text-amber-900">木工製作プロジェクト一覧</h2>
                    <p class="text-sm text-slate-500">保存された作品データの確認・編集・新規作成を行います。</p>
                </div>
                <div class="flex flex-wrap gap-2">
